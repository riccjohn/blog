<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 300" width="2000" height="600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Step 1 inner loop" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker>
    <marker id="ar4R" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="300" fill="#ffffff"/>

  <path d="M160,52 V42 H830 V52" fill="none" stroke="#d35fb7" stroke-width="2"/>
  <text x="495" y="32" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9d174d">Problem space only: no options, plans, estimates or architecture yet</text>
  <path d="M858,52 V42 H990 V52" fill="none" stroke="#4fae63" stroke-width="2"/>
  <text x="924" y="32" text-anchor="middle" font-size="12.5" font-weight="700" fill="#166534">Solution space →</text>

  <rect x="16" y="62" width="118" height="116" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="75" y="83" text-anchor="middle" font-size="13" font-weight="700">Raw ask</text>
  <g font-size="11" fill="#4b5563" text-anchor="middle">
    <text x="75" y="102" font-style="italic">Example:</text>
    <text x="75" y="118">"We need a way for</text>
    <text x="75" y="133">people to easily</text>
    <text x="75" y="148">deploy small apps</text>
    <text x="75" y="163">internally"</text>
  </g>

  <rect x="160" y="85" width="130" height="70" rx="8" fill="#fbe0f1" stroke="#d35fb7" stroke-width="1.5"/>
  <text x="225" y="113" text-anchor="middle" font-size="13" font-weight="700">Listen</text>
  <text x="225" y="132" text-anchor="middle" font-size="10.5">Ask about the problem,</text>
  <text x="225" y="146" text-anchor="middle" font-size="10.5">not the solution</text>

  <rect x="320" y="85" width="180" height="70" rx="8" fill="#fbe0f1" stroke="#d35fb7" stroke-width="1.5"/>
  <text x="410" y="108" text-anchor="middle" font-size="13" font-weight="700">Reflect back</text>
  <text x="410" y="127" text-anchor="middle" font-size="11.5" font-style="italic">"Here's what I'm hearing.</text>
  <text x="410" y="142" text-anchor="middle" font-size="11.5" font-style="italic">Is that right?"</text>

  <polygon points="560,75 605,120 560,165 515,120" fill="#fff" stroke="#111827" stroke-width="2"/>
  <text x="560" y="121" text-anchor="middle" font-size="10.5" font-weight="700">Stakeholder</text>
  <text x="560" y="135" text-anchor="middle" font-size="10.5" font-weight="700">confirms?</text>

  <rect x="640" y="85" width="190" height="70" rx="8" fill="#fbe0f1" stroke="#d35fb7" stroke-width="1.5"/>
  <text x="735" y="108" text-anchor="middle" font-size="13" font-weight="700">Agree on the problem</text>
  <text x="735" y="127" text-anchor="middle" font-size="11.5">Start the Experiment Card:</text>
  <text x="735" y="142" text-anchor="middle" font-size="11.5">who, cost, success, kill, scope</text>

  <g fill="none" stroke="#4b5563" stroke-width="2">
    <path d="M134,120 H156" marker-end="url(#ar4)"/>
    <path d="M290,120 H316" marker-end="url(#ar4)"/>
    <path d="M500,120 H511" marker-end="url(#ar4)"/>
    <path d="M605,120 H636" marker-end="url(#ar4)"/>
    <path d="M830,120 H886" marker-end="url(#ar4)"/>
    <path d="M560,165 V215 H225 V159" stroke-dasharray="6 5" marker-end="url(#ar4)"/>
  </g>
  <text x="611" y="110" font-size="11" font-weight="700" fill="#166534">yes</text>
  <text x="570" y="190" font-size="11" font-weight="700" fill="#9d174d">not quite</text>
  <text x="330" y="236" text-anchor="middle" font-size="12" fill="#9d174d">Go back and ask more until everyone agrees.</text>

  <polygon points="908,104 924,120 908,136 892,120" fill="#fff" stroke="#111827" stroke-width="2"/>
  <text x="908" y="124.5" text-anchor="middle" font-size="10.5" font-weight="700">G1</text>
  <text x="924" y="158" text-anchor="middle" font-size="12" fill="#374151">Gate 1: worth</text>
  <text x="924" y="174" text-anchor="middle" font-size="12" fill="#374151">exploring further?</text>
  <text x="924" y="190" text-anchor="middle" font-size="12" fill="#374151">→ 2a Proof of Thought</text>

  <path d="M735,155 V250 H670" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar4R)"/>
  <text x="664" y="246" text-anchor="end" font-size="12" font-weight="600" fill="#dc2626">No sponsor or no appetite →</text>
  <text x="664" y="262" text-anchor="end" font-size="12" font-weight="600" fill="#dc2626">Shelve (log why)</text>
</svg>
